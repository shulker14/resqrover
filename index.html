<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/src/styles.css"><meta name="description" content="ResQ Rover project workspace"><title>ResQ Rover — Log in</title></head><body class="login-page"><div class="login-bg"></div><div class="shell"><header class="topbar"><a class="brand" href="/">ResQ</a><div class="eyebrow">ROVER / PROJECT WORKSPACE</div></header><main class="login-layout"><section class="login-copy"><div class="eyebrow">RESQ / OUTDOOR ASSISTANCE</div><h1>Get to know<br>Rover.</h1><p>Log in or continue as a guest, choose a park, and meet its Rover. Explore the project and try a conversation.</p></section><section class="auth-card"><h2>Log in</h2><p class="muted">Log in to your ResQ account.</p><form id="loginForm"><label class="form-field">Email<input name="email" type="email" autocomplete="email" required></label><label class="form-field">Password<input name="password" type="password" autocomplete="current-password" required minlength="6"></label><button class="btn primary" style="width:100%" type="submit">Log in</button></form><div class="form-actions"><button class="link-btn" id="createBtn">Create an account</button><button class="link-btn" id="forgotBtn">Forgot password?</button></div><div id="authMessage" class="auth-message"></div><div class="guest-row"><button class="btn" id="guestBtn">Continue as guest</button></div></section></main></div>
<div class="modal" id="signupModal"><div class="modal-card"><div class="modal-head"><div><div class="eyebrow">RESQ ACCOUNT</div><h3>Create an account</h3></div><button class="icon-btn" data-close>×</button></div><form id="signupForm"><label class="form-field">Name<input name="name" required></label><label class="form-field">Email<input name="email" type="email" required></label><label class="form-field">Password<input name="password" type="password" minlength="8" required></label><button class="btn primary" type="submit">Create account</button><div class="auth-message"></div></form></div></div>
<div class="modal" id="recoverModal"><div class="modal-card"><div class="modal-head"><div><div class="eyebrow">ACCOUNT RECOVERY</div><h3>Reset password</h3></div><button class="icon-btn" data-close>×</button></div><form id="recoverForm"><label class="form-field">Email<input name="email" type="email" required></label><button class="btn primary" type="submit">Send recovery email</button><div class="auth-message"></div></form></div></div><script type="module" src="/src/login.js"></script></body></html>
